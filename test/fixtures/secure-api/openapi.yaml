openapi: 3.1.0
info: { title: secure-api, version: 1.0.0 }
paths:
  /v1/users:
    get:
      parameters:
        - { name: name, in: query, required: true, schema: { type: string, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Users, content: { application/json: { schema: { $ref: '#/components/schemas/UserList' } } } }
        '400': { $ref: '#/components/responses/Problem' }
  /v1/orders:
    post:
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string } }
      responses:
        '201': { description: Created }
        '400': { $ref: '#/components/responses/Problem' }
components:
  schemas:
    UserList: { type: object, properties: { data: { type: array, items: { type: object, properties: { id: { type: string }, name: { type: string } } } } } }
  responses:
    Problem: { description: Problem details, content: { application/problem+json: { schema: { type: object } } } }
