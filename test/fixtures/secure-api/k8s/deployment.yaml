apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-api
spec:
  replicas: 3
  selector: { matchLabels: { app: secure-api } }
  template:
    metadata: { labels: { app: secure-api } }
    spec:
      terminationGracePeriodSeconds: 45
      containers:
        - name: api
          image: secure-api:latest
          env:
            - { name: NODE_OPTIONS, value: "--max-old-space-size=384" }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { memory: 512Mi }
          readinessProbe: { httpGet: { path: /readyz, port: 3000 }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: 3000 }, periodSeconds: 10 }
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secure-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: secure-api }
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
